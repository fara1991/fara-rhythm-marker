name: 改善提案
description: 既存機能の改善や最適化の提案をお聞かせください
labels: ["enhancement"]
body:
  - type: textarea
    id: current-feature
    attributes:
      label: 改善したい機能
      description: 現在の機能のどの部分を改善したいかを説明してください
      placeholder: "例：マーカー表示設定"
    validations:
      required: true
  - type: textarea
    id: improvement-proposal
    attributes:
      label: 改善提案の内容
      description: 具体的にどのような改善を提案しますか？
      placeholder: "例：マーカーの色・サイズ・透明度をカスタマイズ可能にする"
    validations:
      required: true
  - type: textarea
    id: current-problem
    attributes:
      label: 現在の問題点
      description: 現在の実装で何が問題だと感じていますか？
      placeholder: "例：固定のマーカー表示では環境によって見にくい場合がある"
    validations:
      required: true
  - type: textarea
    id: expected-benefit
    attributes:
      label: 期待するメリット
      description: この改善によってどのような利益が得られると考えますか？
      placeholder: "例：プレイヤーの好みに合わせた表示が可能になる"
    validations:
      required: true
  - type: textarea
    id: implementation-ideas
    attributes:
      label: 実装のアイデア
      description: 実装方法について何かアイデアがあれば共有してください
      placeholder: "例：PluginConfigにカスタマイズ項目を追加"
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: 追加情報
      description: その他、参考になる情報があれば記載してください
    validations:
      required: false
