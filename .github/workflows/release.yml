name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      bs_version:
        description: 'Beat Saber version to build'
        required: true
        default: '1.29.1'
        type: choice
        options:
          - '1.29.1'
          - '1.40.8'
          - 'both'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        bs_version: ${{ inputs.bs_version == 'both' && fromJson('["1.29.1", "1.40.8"]') || fromJson(format('["{0}"]', inputs.bs_version)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Beat Saber References
        run: |
          $bsVersion = "${{ matrix.bs_version }}"
          $refsDir = "FaraRhythmMarker/Refs/$bsVersion"
          $managedDir = "$refsDir/Beat Saber_Data/Managed"
          $pluginsDir = "$refsDir/Plugins"

          # Create directory structure matching Beat Saber installation
          New-Item -ItemType Directory -Force -Path $managedDir
          New-Item -ItemType Directory -Force -Path $pluginsDir

          # Download stripped references
          # Option 1: From your own repository release
          if ("${{ secrets.REFS_URL }}" -ne "") {
            $refsUrl = "${{ secrets.REFS_URL }}/refs-$bsVersion.zip"
            Write-Host "Downloading references from: $refsUrl"
            Invoke-WebRequest -Uri $refsUrl -OutFile "refs.zip"
            Expand-Archive -Path "refs.zip" -DestinationPath $refsDir -Force
            Remove-Item "refs.zip"
          }
          # Option 2: From Libs folder in repository (if committed)
          elseif (Test-Path "FaraRhythmMarker/Libs/$bsVersion") {
            Write-Host "Using Libs folder references"
            Copy-Item -Path "FaraRhythmMarker/Libs/$bsVersion/*" -Destination $refsDir -Recurse -Force
          }
          else {
            Write-Host "::error::No reference DLLs found. Please set REFS_URL secret or add DLLs to Libs folder."
            exit 1
          }
        shell: pwsh

      - name: Build
        run: |
          dotnet build FaraRhythmMarker/FaraRhythmMarker.csproj `
            -c Release `
            -p:BSVersion=${{ matrix.bs_version }} `
            -p:BuildingMultipleVersions=true `
            -p:CIBuild=true
        shell: pwsh

      - name: Prepare Release Asset
        run: |
          $bsVersion = "${{ matrix.bs_version }}"
          $tag = "${{ inputs.tag }}"
          $outputDir = "release-$bsVersion"
          New-Item -ItemType Directory -Force -Path $outputDir

          # Copy DLL
          Copy-Item "FaraRhythmMarker/bin/Release/FaraRhythmMarker.dll" -Destination $outputDir

          # Create zip
          $zipName = "FaraRhythmMarker-$tag-BS$bsVersion.zip"
          Compress-Archive -Path "$outputDir/*" -DestinationPath $zipName

          echo "ASSET_NAME=$zipName" >> $env:GITHUB_ENV
          echo "BS_VERSION=$bsVersion" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaraRhythmMarker-BS${{ matrix.bs_version }}
          path: ${{ env.ASSET_NAME }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or Update Tag
        run: |
          TAG="${{ inputs.tag }}"

          # Check if tag exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created new tag: $TAG"
          fi

      - name: Generate Release Notes
        id: notes
        run: |
          BS_VERSIONS=""
          if [ "${{ inputs.bs_version }}" = "both" ]; then
            BS_VERSIONS="- 1.29.1\n- 1.40.8"
          else
            BS_VERSIONS="- ${{ inputs.bs_version }}"
          fi

          cat << EOF > release_notes.md
          ## FaraRhythmMarker ${{ inputs.tag }}

          A rhythm marker mod for Beat Saber that displays visual markers synchronized to the beat.

          ### Supported Beat Saber Versions
          $(echo -e "$BS_VERSIONS")

          ### Installation
          1. Download the zip file for your Beat Saber version
          2. Extract \`FaraRhythmMarker.dll\` to your \`Beat Saber/Plugins\` folder

          ### Requirements
          - BSIPA
          - SiraUtil
          - BSML (BeatSaberMarkupLanguage)

          ### Features
          - BPM change detection and marker speed adjustment
          - Customizable colors (1, 2, or 4 color modes)
          - Adjustable marker size, opacity, and flash duration
          - Z-offset adjustment for audio latency compensation
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "FaraRhythmMarker ${{ inputs.tag }}"
          body_path: release_notes.md
          files: artifacts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
